# Publie une release GitHub avec l'extension zippée quand un tag vX.Y.Z est poussé.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du manifest
        run: |
          version=$(jq -r .version manifest.json)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "manifest $version ≠ tag $GITHUB_REF_NAME"; exit 1; }

      - name: Construire le zip
        run: zip -r "rpgmasters-helper-$GITHUB_REF_NAME.zip" manifest.json src icons

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          gh release create "$GITHUB_REF_NAME" "rpgmasters-helper-$GITHUB_REF_NAME.zip" \
            --title "RpgMasters Helper $GITHUB_REF_NAME" \
            $( [ -f "$notes" ] && echo "--notes-file $notes" || echo "--generate-notes" )
