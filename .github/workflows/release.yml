# Publie une release GitHub (tag vX.Y.Z + extension zippée) quand la version de
# manifest.json change sur main. Rien n'est fait si la release de cette version existe déjà.
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version manifest.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag déjà publiée."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire le zip
        if: steps.version.outputs.exists != 'true'
        run: zip -r "rpgmasters-helper-${{ steps.version.outputs.tag }}.zip" manifest.json src icons

      - name: Créer la release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" "rpgmasters-helper-$TAG.zip" \
            --target "$GITHUB_SHA" --title "RpgMasters Helper $TAG" "$@"
